
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#08070d">
    <meta name="description" content="The ultimate GTA VI countdown. The wait is almost over.">

    <title>GTA VI — The Countdown</title>

    <style>
        /* =====================================
           GLOBAL STYLES
        ===================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #08070d;
            --pink: #ff3cac;
            --cyan: #00e5ff;
            --white: #ffffff;
            --muted: #85818f;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            background: var(--background);
            color: var(--white);
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* =====================================
           BACKGROUND EFFECTS
        ===================================== */

        .background {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            background:
                radial-gradient(
                    ellipse at 50% 40%,
                    rgba(111, 24, 91, 0.17),
                    transparent 55%
                ),
                radial-gradient(
                    ellipse at 15% 85%,
                    rgba(0, 180, 255, 0.09),
                    transparent 40%
                ),
                #08070d;
        }

        .glow {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.13;
            animation: float 9s ease-in-out infinite alternate;
        }

        .glow-pink {
            background: var(--pink);
            top: -200px;
            left: -150px;
        }

        .glow-cyan {
            background: var(--cyan);
            bottom: -250px;
            right: -150px;
            animation-delay: -4s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(70px, 50px);
            }
        }

        /* Subtle background grid */

        .grid {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.018) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.018) 1px,
                    transparent 1px
                );

            background-size: 65px 65px;

            mask-image: linear-gradient(
                to bottom,
                transparent,
                black 25%,
                black 75%,
                transparent
            );
        }

        /* =====================================
           MAIN LAYOUT
        ===================================== */

        main {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 70px 24px 55px;
            text-align: center;
        }

        .top-label {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 28px;
            animation: fadeUp 1s ease both;
        }

        .top-label::before,
        .top-label::after {
            content: "";
            height: 1px;
            width: 35px;
            background: linear-gradient(
                90deg,
                transparent,
                var(--pink)
            );
        }

        .top-label::after {
            transform: rotate(180deg);
        }

        /* =====================================
           GTA VI TITLE
        ===================================== */

        .title {
            position: relative;
            font-size: clamp(76px, 15vw, 165px);
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: -10px;
            margin-bottom: 22px;

            background: linear-gradient(
                135deg,
                #ffffff 10%,
                #ffb7e2 38%,
                #ff3cac 65%,
                #a855f7 100%
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            filter: drop-shadow(
                0 0 35px rgba(255, 60, 172, 0.25)
            );

            animation: titleReveal 1.2s ease both;
        }

        @keyframes titleReveal {
            from {
                opacity: 0;
                transform: translateY(25px);
                filter: blur(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: drop-shadow(
                    0 0 35px rgba(255, 60, 172, 0.25)
                );
            }
        }

        .subtitle {
            color: #d8d1dc;
            font-size: 11px;
            letter-spacing: 6px;
            font-weight: 500;
            margin-bottom: 75px;
            animation: fadeUp 1s 0.3s ease both;
        }

        /* =====================================
           COUNTDOWN
        ===================================== */

        .countdown-container {
            width: min(850px, 100%);
            animation: fadeUp 1s 0.5s ease both;
        }

        .countdown-heading {
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 5px;
            margin-bottom: 28px;
            text-transform: uppercase;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .time-box {
            position: relative;
            padding: 32px 12px 27px;
            background: linear-gradient(
                145deg,
                rgba(255,255,255,0.045),
                rgba(255,255,255,0.012)
            );

            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 12px;

            box-shadow:
                0 0 35px rgba(255, 60, 172, 0.035),
                inset 0 0 25px rgba(255,255,255,0.015);

            backdrop-filter: blur(10px);
            transition: border-color 0.3s, transform 0.3s;
            overflow: hidden;
        }

        .time-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 20%;
            width: 60%;
            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                var(--pink),
                var(--cyan),
                transparent
            );

            opacity: 0.8;
        }

        .time-box:hover {
            transform: translateY(-5px);
            border-color: rgba(255,60,172,0.4);
        }

        .number {
            display: block;
            font-size: clamp(38px, 7vw, 76px);
            font-weight: 700;
            letter-spacing: -3px;
            line-height: 1.1;

            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";

            color: #ffffff;

            text-shadow:
                0 0 15px rgba(255,60,172,0.25),
                0 0 35px rgba(0,229,255,0.08);

            transition:
                opacity 0.12s ease,
                transform 0.12s ease;
        }

        .number.changing {
            opacity: 0.65;
            transform: translateY(-3px);
        }

        .unit {
            display: block;
            color: var(--muted);
            font-size: 9px;
            letter-spacing: 4px;
            margin-top: 15px;
            font-weight: 600;
        }

        /* =====================================
           RELEASE DATE
        ===================================== */

        .release-info {
            margin-top: 55px;
            animation: fadeUp 1s 0.7s ease both;
        }

        .release-label {
            color: var(--muted);
            font-size: 9px;
            letter-spacing: 4px;
            margin-bottom: 12px;
        }

        .release-date {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 3px;
            color: #f5e9f3;
        }

        .release-date span {
            color: var(--pink);
        }

        /* =====================================
           DECORATIVE LINE
        ===================================== */

        .bottom-line {
            width: 90px;
            height: 2px;
            margin: 45px auto 0;

            background: linear-gradient(
                90deg,
                transparent,
                var(--pink),
                var(--cyan),
                transparent
            );

            box-shadow: 0 0 15px rgba(255,60,172,0.5);
        }

        /* =====================================
           FOOTER
        ===================================== */

        footer {
            padding: 25px 15px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.055);
            background: rgba(0,0,0,0.12);
        }

        footer p {
            color: #66616e;
            font-size: 10px;
            letter-spacing: 0.5px;
            line-height: 1.8;
        }

        /* =====================================
           GENERAL ANIMATIONS
        ===================================== */

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =====================================
           RESPONSIVE DESIGN
        ===================================== */

        @media (max-width: 600px) {

            main {
                padding: 65px 18px 45px;
            }

            .title {
                letter-spacing: -5px;
                font-size: clamp(65px, 17vw, 100px);
            }

            .subtitle {
                font-size: 9px;
                letter-spacing: 4px;
                margin-bottom: 55px;
            }

            .top-label {
                font-size: 8px;
                letter-spacing: 3px;
            }

            .countdown {
                gap: 9px;
            }

            .time-box {
                padding: 25px 5px 20px;
                border-radius: 9px;
            }

            .number {
                font-size: clamp(30px, 9vw, 48px);
                letter-spacing: -2px;
            }

            .unit {
                font-size: 8px;
                letter-spacing: 2px;
                margin-top: 12px;
            }

            .countdown-heading {
                font-size: 9px;
                letter-spacing: 3px;
            }

            .release-info {
                margin-top: 45px;
            }

            .release-date {
                font-size: 12px;
                letter-spacing: 2px;
            }
        }

        @media (max-width: 350px) {
            .countdown {
                gap: 6px;
            }

            .number {
                font-size: 27px;
            }

            .unit {
                font-size: 7px;
                letter-spacing: 1px;
            }
        }

        /* Accessibility */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

    </style>
</head>

<body>

    <!-- Background -->
    <div class="background">
        <div class="glow glow-pink"></div>
        <div class="glow glow-cyan"></div>
    </div>

    <div class="grid"></div>

    <!-- Main Content -->
    <main>

        <div class="top-label">
            THE NEXT CHAPTER
        </div>

        <h1 class="title">
            GTA VI
        </h1>

        <p class="subtitle">
            THE WAIT IS ALMOST OVER
        </p>

        <!-- Countdown -->
        <section class="countdown-container">

            <p class="countdown-heading">
                COUNTING DOWN TO THE RELEASE
            </p>

            <div class="countdown">

                <div class="time-box">
                    <span class="number" id="days">000</span>
                    <span class="unit">DAYS</span>
                </div>

                <div class="time-box">
                    <span class="number" id="hours">00</span>
                    <span class="unit">HOURS</span>
                </div>

                <div class="time-box">
                    <span class="number" id="minutes">00</span>
                    <span class="unit">MINUTES</span>
                </div>

                <div class="time-box">
                    <span class="number" id="seconds">00</span>
                    <span class="unit">SECONDS</span>
                </div>

            </div>

        </section>

        <!-- Release Date -->
        <div class="release-info">

            <p class="release-label">
                OFFICIAL RELEASE DATE
            </p>

            <p class="release-date">
                <span>NOVEMBER</span> 19, 2026
            </p>

        </div>

        <div class="bottom-line"></div>

    </main>

    <!-- Footer -->
    <footer>
        <p>
            Unofficial fan-made countdown website.
            Not affiliated with Rockstar Games.
        </p>
    </footer>


    <!-- =====================================
         JAVASCRIPT COUNTDOWN
    ====================================== -->

    <script>

        // =================================
        // CONFIGURATION
        // =================================

        // November 19, 2026 at midnight
        // in the visitor's local timezone.

        const releaseDate = new Date(
            2026, 10, 19, 0, 0, 0
        ).getTime();


        // Countdown elements

        const elements = {
            days: document.getElementById("days"),
            hours: document.getElementById("hours"),
            minutes: document.getElementById("minutes"),
            seconds: document.getElementById("seconds")
        };


        // =================================
        // FORMAT NUMBERS
        // =================================

        function formatNumber(number, length) {
            return String(number).padStart(length, "0");
        }


        // =================================
        // CALCULATE REAL COUNTDOWN
        // =================================

        function getCountdown() {

            const now = Date.now();

            let difference = Math.max(
                0,
                releaseDate - now
            );

            const days = Math.floor(
                difference / (1000 * 60 * 60 * 24)
            );

            difference %= 1000 * 60 * 60 * 24;

            const hours = Math.floor(
                difference / (1000 * 60 * 60)
            );

            difference %= 1000 * 60 * 60;

            const minutes = Math.floor(
                difference / (1000 * 60)
            );

            difference %= 1000 * 60;

            const seconds = Math.floor(
                difference / 1000
            );

            return {
                days: formatNumber(days, 3),
                hours: formatNumber(hours, 2),
                minutes: formatNumber(minutes, 2),
                seconds: formatNumber(seconds, 2)
            };
        }


        // =================================
        // UPDATE COUNTDOWN
        // =================================

        function updateCountdown() {

            const time = getCountdown();

            Object.keys(elements).forEach(key => {

                const element = elements[key];

                const newValue = time[key];

                if (element.textContent !== newValue) {

                    element.classList.add("changing");

                    element.textContent = newValue;

                    requestAnimationFrame(() => {
                        element.classList.remove("changing");
                    });

                }

            });

        }


        // =================================
        // RANDOM NUMBER SCRAMBLE
        // =================================

        function scrambleNumbers() {

            const keys = Object.keys(elements);

            keys.forEach(key => {
                elements[key].textContent =
                    "0".repeat(key === "days" ? 3 : 2);
            });

            const scrambleDuration = 1800;
            const scrambleInterval = 45;

            const startTime = performance.now();

            const interval = setInterval(() => {

                const elapsed = performance.now() - startTime;

                if (elapsed >= scrambleDuration) {

                    clearInterval(interval);

                    // Reveal the real countdown
                    updateCountdown();

                    // Start the real-time countdown
                    setInterval(updateCountdown, 1000);

                    return;
                }

                // Generate random digits
                keys.forEach(key => {

                    const length = key === "days" ? 3 : 2;

                    let randomValue = "";

                    for (let i = 0; i < length; i++) {

                        randomValue += Math.floor(
                            Math.random() * 10
                        );

                    }

                    const element = elements[key];

                    element.classList.add("changing");

                    element.textContent = randomValue;

                    requestAnimationFrame(() => {
                        element.classList.remove("changing");
                    });

                });

            }, scrambleInterval);

        }


        // =================================
        // START WEBSITE
        // =================================

        // Run the intro animation every time
        // someone opens or refreshes the page.

        scrambleNumbers();

    </script>

</body>
</html>
